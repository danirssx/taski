name: Documentation

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout contribution
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check local documentation links
        run: python3 scripts/check_docs.py
      - name: Check published baseline and neutral fixtures
        run: python3 scripts/check_linear_baseline.py
      - name: Install B0 experiment dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install -r experiments/b0/requirements-lock.txt
      - name: Verify B0 contract and proxy budgets
        run: |
          .venv/bin/python -m unittest discover -s experiments/b0 -v
          .venv/bin/python experiments/b0/measure.py --check
      - name: Check patch formatting
        run: git show --format= --check HEAD
